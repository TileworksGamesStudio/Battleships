<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080e18" />
  <title>Classic Battleship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-viewport">
    <!-- Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="radar-dot"></span>
        <h1 class="game-title">BATTLESHIP</h1>
      </div>
      <div class="nav-controls">
        <button id="soundToggle" class="icon-btn" aria-label="Toggle Sound" title="Sound">
          <svg id="soundOnIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Banner -->
    <section class="status-strip">
      <span id="statusText" class="status-msg">Position your fleet</span>
    </section>

    <!-- Mobile View Tabs (Hidden on Desktop) -->
    <nav class="theater-tabs" id="theaterTabs">
      <button class="tab-btn active" id="tabEnemy" data-view="enemy">
        TARGET RADAR
        <span class="fleet-count" id="enemyFleetCount">5</span>
      </button>
      <button class="tab-btn" id="tabPlayer" data-view="player">
        YOUR FLEET
        <span class="fleet-count" id="playerFleetCount">5</span>
      </button>
    </nav>

    <!-- Grids Arena -->
    <main class="battleground">
      <!-- Enemy Theater -->
      <div class="grid-card enemy-theater" id="enemyCard">
        <div class="grid-header">
          <span class="grid-label">RADAR // HOSTILE</span>
          <div class="fleet-indicators" id="enemyFleetPills"></div>
        </div>
        <div class="grid-wrapper">
          <div class="axis-y" id="enemyAxisY"></div>
          <div class="grid-main">
            <div class="axis-x" id="enemyAxisX"></div>
            <div class="matrix" id="enemyGrid" role="grid"></div>
          </div>
        </div>
      </div>

      <!-- Player Theater -->
      <div class="grid-card player-theater active" id="playerCard">
        <div class="grid-header">
          <span class="grid-label">DEFENSE // FRIENDLY</span>
          <div class="fleet-indicators" id="playerFleetPills"></div>
        </div>
        <div class="grid-wrapper">
          <div class="axis-y" id="playerAxisY"></div>
          <div class="grid-main">
            <div class="axis-x" id="playerAxisX"></div>
            <div class="matrix" id="playerGrid" role="grid"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Controls Deck -->
    <footer class="controls-deck">
      <!-- Setup Mode Tools -->
      <div class="deck-setup" id="setupControls">
        <button id="rotateBtn" class="action-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.83 6.72 2.24L21 8"></path>
            <polyline points="21 3 21 8 16 8"></polyline>
          </svg>
          <span id="orientationLabel">ROTATE (H)</span>
        </button>
        <button id="randomBtn" class="action-btn">RANDOM</button>
        <button id="startBattleBtn" class="action-btn primary-btn">START BATTLE</button>
      </div>

      <!-- Live Battle Indicators -->
      <div class="deck-battle hidden" id="battleControls">
        <div class="quick-metric">
          <span class="metric-title">ACCURACY</span>
          <span class="metric-val" id="accuracyVal">0%</span>
        </div>
        <div class="quick-metric">
          <span class="metric-title">TURNS</span>
          <span class="metric-val" id="turnsVal">0</span>
        </div>
        <button id="rematchQuickBtn" class="action-btn danger-btn">RESTART</button>
      </div>
    </footer>

    <!-- Game End Overlay -->
    <div class="modal-overlay hidden" id="gameModal">
      <div class="modal-card">
        <h2 id="modalTitle" class="modal-title">VICTORY</h2>
        <p id="modalDesc" class="modal-desc">All enemy vessels have been neutralized.</p>
        <div class="modal-stats">
          <div class="stat-item">
            <span class="stat-label">TURNS</span>
            <span class="stat-val" id="modalTurns">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">ACCURACY</span>
            <span class="stat-val" id="modalAccuracy">0%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">SURVIVORS</span>
            <span class="stat-val" id="modalSurvivors">0/5</span>
          </div>
        </div>
        <button id="playAgainBtn" class="action-btn primary-btn modal-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
