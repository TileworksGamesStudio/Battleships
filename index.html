<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#030712" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BATTLESHIP // Tactical Naval Command</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;0,800;1,700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Tactical HUD Scanline -->
  <div class="hud-overlay" aria-hidden="true"></div>

  <!-- Primary Mobile Tactical Viewport -->
  <div class="command-shell">
    
    <!-- Top Command Strip -->
    <header class="command-header">
      <div class="brand-cluster">
        <div class="radar-beacon">
          <span class="beacon-core"></span>
          <span class="beacon-wave"></span>
        </div>
        <div class="brand-meta">
          <span class="brand-code">SEC-NAV // 10×10</span>
          <h1 class="brand-title">BATTLESHIP</h1>
        </div>
      </div>

      <div class="header-tools">
        <!-- Ping Sonar FX -->
        <button id="sonarBtn" class="hud-icon-btn" aria-label="Tactical Sonar Pulse">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </button>

        <!-- Audio Mute -->
        <button id="soundToggle" class="hud-icon-btn" aria-label="Toggle Sound">
          <svg id="soundOnIcon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Tactical Ticker / Comms Teletype -->
    <div class="tactical-ticker">
      <span class="ticker-prefix">STATUS &gt;</span>
      <span id="commsText" class="ticker-body">DEPLOY WARSHIPS: TAP GRID OR USE DOCK</span>
      <span class="ticker-blip"></span>
    </div>

    <!-- Active Naval Arena -->
    <main class="naval-arena" id="arena">
      <canvas id="fxCanvas" class="fx-canvas"></canvas>

      <!-- Target Theater (Hostile Waters) -->
      <section class="theater-card enemy-card" id="enemyCard">
        <div class="theater-bar">
          <div class="theater-tag">
            <span class="dot-radar hostile"></span>
            <span class="theater-name">TARGET RADAR</span>
          </div>
          <div class="fleet-health" id="enemyFleetPills"></div>
        </div>

        <div class="matrix-box">
          <div class="axis-y" id="enemyAxisY" aria-hidden="true"></div>
          <div class="matrix-core">
            <div class="axis-x" id="enemyAxisX" aria-hidden="true"></div>
            <div class="grid-surface" id="enemyGrid" role="grid"></div>
          </div>
        </div>
      </section>

      <!-- Harbor Theater (Friendly Fleet) -->
      <section class="theater-card player-card active" id="playerCard">
        <div class="theater-bar">
          <div class="theater-tag">
            <span class="dot-radar friendly"></span>
            <span class="theater-name">HARBOR DEFENSE</span>
          </div>
          <div class="fleet-health" id="playerFleetPills"></div>
        </div>

        <div class="matrix-box">
          <div class="axis-y" id="playerAxisY" aria-hidden="true"></div>
          <div class="matrix-core">
            <div class="axis-x" id="playerAxisX" aria-hidden="true"></div>
            <div class="grid-surface" id="playerGrid" role="grid"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Thumb Deck -->
    <footer class="thumb-deck">
      
      <!-- SETUP DECK -->
      <div class="deck-cluster" id="setupControls">
        <!-- Ship Scroll Dock -->
        <div class="ship-dock" id="shipDock" role="tablist"></div>

        <!-- Quick Deployment Triggers -->
        <div class="deck-row">
          <button id="rotateBtn" class="hud-btn action-rotate" aria-label="Rotate Orientation">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
              <path d="M16 21h5v-5"></path>
            </svg>
            <span id="orientationLabel">ROT (H)</span>
          </button>

          <button id="scrambleBtn" class="hud-btn action-scramble" aria-label="Auto Scramble Fleet">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>SCRAMBLE</span>
          </button>

          <button id="startBattleBtn" class="hud-btn action-engage" disabled>
            <span>ENGAGE</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
          </button>
        </div>
      </div>

      <!-- COMBAT DECK -->
      <div class="deck-cluster hidden" id="battleControls">
        <!-- Segmented Thumb Switcher -->
        <nav class="theater-tabs">
          <button class="tab-btn active" id="tabEnemy">
            <span class="tab-dot hostile"></span>
            <span>TARGET RADAR</span>
            <span class="badge" id="enemyCountBadge">5</span>
          </button>
          <button class="tab-btn" id="tabPlayer">
            <span class="tab-dot friendly"></span>
            <span>HARBOR</span>
            <span class="badge" id="playerCountBadge">5</span>
            <span class="incoming-alert hidden" id="incomingAlert">!</span>
          </button>
        </nav>

        <!-- Live Combat Telemetry -->
        <div class="combat-metrics">
          <div class="metric-block">
            <span class="metric-label">SALVOES</span>
            <span class="metric-value" id="shotsMetric">0</span>
          </div>
          <div class="metric-block">
            <span class="metric-label">ACCURACY</span>
            <span class="metric-value" id="accuracyMetric">0%</span>
          </div>
          <div class="metric-block">
            <span class="metric-label">CONFIRMED</span>
            <span class="metric-value" id="sunkMetric">0/5</span>
          </div>
          <button id="abortBtn" class="hud-btn action-abort" aria-label="Abort Mission">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>ABORT</span>
          </button>
        </div>
      </div>

    </footer>

    <!-- Mission Debrief Modal -->
    <div class="modal-layer hidden" id="gameModal">
      <div class="debrief-box">
        <div class="debrief-rank" id="modalRank">★★★★★ FLEET ADMIRAL</div>
        <h2 class="debrief-title" id="modalTitle">VICTORY</h2>
        <p class="debrief-subtitle" id="modalDesc">Hostile naval squadron completely destroyed.</p>

        <div class="debrief-grid">
          <div class="debrief-stat">
            <span class="d-label">SALVOES</span>
            <span class="d-val" id="modalSalvoes">0</span>
          </div>
          <div class="debrief-stat">
            <span class="d-label">ACCURACY</span>
            <span class="d-val" id="modalAccuracy">0%</span>
          </div>
          <div class="debrief-stat">
            <span class="d-label">SURVIVORS</span>
            <span class="d-val" id="modalSurvivors">0/5</span>
          </div>
        </div>

        <div class="debrief-share-preview" id="shareSummary"></div>

        <div class="debrief-actions">
          <button id="shareReportBtn" class="hud-btn debrief-share">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>SHARE DEBRIEF</span>
          </button>
          <button id="playAgainBtn" class="hud-btn debrief-restart">
            <span>RE-DEPLOY FLEET</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Micro Toast Notification -->
    <div class="tactical-toast hidden" id="toastNotice"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
